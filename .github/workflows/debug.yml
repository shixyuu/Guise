name: Debug Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/debug.yml"
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI(s), comma-separated (e.g. arm64-v8a or all)'
        required: false
        default: 'arm64-v8a'
      include_legacy:
        description: 'Build legacy (minSdk 21) variant'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Optional GitHub Release tag to publish APK as pre-release (e.g. v2.0-debug)'
        required: false
        default: 'v2.0-debug'
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout ByeDPI submodule
        run: git submodule update --init library/byedpi
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.4
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Patch libexclavecore
        run: |
          git clone https://github.com/exclavenetwork/libexclavecore.git /tmp/libexclavecore
          git -C /tmp/libexclavecore -c user.name="Guise" -c user.email="guise@localhost" am "$GITHUB_WORKSPACE/library/core/patches/libexclavecore-guise-dualnet.patch"
          git -C /tmp/libexclavecore -c user.name="Guise" -c user.email="guise@localhost" am "$GITHUB_WORKSPACE/library/core/patches/libexclavecore-guise-shaper.patch"
          git -C /tmp/libexclavecore -c user.name="Guise" -c user.email="guise@localhost" am "$GITHUB_WORKSPACE/library/core/patches/libexclavecore-guise-lanpeer.patch"
          cat > library/core/go.work <<'EOF'
          go 1.27
          use (
          	.
          	/tmp/libexclavecore
          )
          EOF
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ "${{ inputs.abi }}" = "arm64-v8a" ]; then
            mkdir -p app/libs
            (cd library/core && CGO_LDFLAGS="-Wl,-z,max-page-size=16384" gomobile bind -v -target=android/arm64 -androidapi 21 -tags="with_clash" "github.com/exclavenetwork/libexclavecore")
            cp -vf library/core/libexclavecore.aar app/libs/
          else
            ./run lib core debug
          fi
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-debug-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets
          ABI_ARG=""
          if [ -n "${{ inputs.abi }}" ] && [ "${{ inputs.abi }}" != "all" ]; then
            ABI_ARG="-Pabi=${{ inputs.abi }}"
          fi
          TASKS=":app:assembleOssDebug"
          if [ "${{ inputs.include_legacy }}" = "true" ] || [ -z "${{ inputs.abi }}" ]; then
            TASKS="$TASKS :app:assembleLegacyDebug"
          fi
          ./gradlew $TASKS $ABI_ARG
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/debug
      - name: Upload Artifacts
        if: inputs.include_legacy == true || inputs.abi == ''
        uses: actions/upload-artifact@v7
        with:
          name: APKs-legacy
          path: app/build/outputs/apk/legacy/debug
  publish:
    name: Publish Pre-release
    if: github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts/oss
      - name: Download Legacy APKs
        if: inputs.include_legacy == true || inputs.abi == ''
        uses: actions/download-artifact@v8
        with:
          name: APKs-legacy
          path: artifacts/legacy
      - name: Create or Upload Pre-release
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          TAG="${{ github.event.inputs.release_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.apk$' || true); do
              gh release delete-asset "$TAG" "$asset" -y || true
            done
            gh release upload "$TAG" --clobber ./apks/*
          else
            gh release create "$TAG" --title "$TAG" --notes "Debug build from Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --prerelease ./apks/*
          fi
